[pytest]
asyncio_mode = auto
# A worker that dies (the hard per-test limit in tests/conftest.py ends a hung test that way) is replaced once and
# the run then stops: without this xdist replaced it up to 4 x workers times, and each replacement ran the hung
# test again for the full limit (FREEJ-64). No faulthandler_timeout here either: pytest's own timer and the hard
# limit share the one faulthandler timer.
addopts = --max-worker-restart=1
