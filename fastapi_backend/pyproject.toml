[project]
name = "yourapp-backend"
version = "0.1.0"
description = "Your App FastAPI backend (adapted from vintasoftware/nextjs-fastapi-template, see TEMPLATE_LICENSE.txt)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.143.0,<0.144",
    "asyncpg>=0.32.0,<0.33",
    "sqlalchemy[asyncio]>=2.1.4,<3",
    "pydantic-settings>=2.15.0,<3",
    "upstash-ratelimit==1.2.0",
    "upstash-redis==1.8.0",
    "sentry-sdk[fastapi]==2.72.0",
    "cuid2==2.0.1",
    "firebase-admin==7.7.0",
    "cryptography==50.0.2",
    "httpx>=0.28.1,<0.29",
    "alembic>=1.20.0,<2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0,<5",
    "ruff>=0.17.0,<0.18",
    "watchdog>=6.0.0,<7",
    "python-dotenv>=1.2.4,<2",
    "pytest>=9.1.1,<10",
    "pytest-mock>=3.16.0,<4",
    "mypy>=2.4.0,<3",
    "coveralls>=4.1.0,<5",
    "pytest-asyncio>=1.4.0,<2",
    "mkdocs-material>=9.7.7",
    "mkdocs-material[imaging]>=9.7.7",
    "pytest-cov>=7.1.0,<8",
    "pytest-xdist>=3.8.0,<4",
]

[tool.uv]
package = false

# Makes ruff treat this folder as its project root even when it is run from the
# repository root (the pre-commit hook does), so app, tests and commands are
# classified as first-party imports in both places.
[tool.ruff]
src = ["."]

# ADR-004: database engines are built in app/core/database.py only. TID251 bans the SQLAlchemy engine
# factories (sync, async and from-config, under both import paths) and app.core.database.build_engine
# everywhere else; app/core/database.py, alembic_migrations/env.py and tests are exempt. Session makers
# are not banned.
[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.create_engine".msg = "Build engines in app/core/database.py only (ADR-004)."
"sqlalchemy.engine_from_config".msg = "Build engines in app/core/database.py only (ADR-004)."
"sqlalchemy.engine.create_engine".msg = "Build engines in app/core/database.py only (ADR-004)."
"sqlalchemy.ext.asyncio.create_async_engine".msg = "Build engines in app/core/database.py only (ADR-004)."
"sqlalchemy.ext.asyncio.engine.create_async_engine".msg = "Build engines in app/core/database.py only (ADR-004)."
"sqlalchemy.ext.asyncio.async_engine_from_config".msg = "Build engines in app/core/database.py only (ADR-004)."
"app.core.database.build_engine".msg = "Build engines in app/core/database.py only (ADR-004)."

[tool.ruff.lint.per-file-ignores]
"app/core/database.py" = ["TID251"]
"alembic_migrations/env.py" = ["TID251"]
"tests/**" = ["TID251"]

# Coverage ratchet. `uv run pytest --cov` fails when line coverage of app/ and
# commands/ is below fail_under. fail_under is set about 1 point under the
# coverage measured without the Postgres-backed *_e2e tests (91.55%; with them
# 96.27%): raise it as tests are added, never lower it.
[tool.coverage.run]
source = ["app", "commands"]

[tool.coverage.report]
fail_under = 90.0
precision = 2

[tool.hatch.build.targets.sdist]
include = ["commands"]

[tool.hatch.build.targets.wheel]
include = ["commands"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
